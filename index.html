function hdr(pop){const b=$('#bal');b.textContent='$'+st.bal.toLocaleString('ru');if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}save()}
function money(n){st.bal+=n;hdr(1)}
const ov=$('#ov'),closeOv=()=>{ov.classList.remove('on');render()};
function showRes(title,it,sub){ov.innerHTML=`<div class="ovb"><h2>${title}</h2>${it?card(it,'big'):'<div style="font-size:70px">💥</div>'}<p class="mut">${sub||''}</p><div class="row"><button class="btn" onclick="closeOv()">Ок</button></div></div>`;ov.classList.add('on')}
let tab='cases';const TABS=[['cases','📦 Кейсы'],['flappy','🐦 Заработок'],['inv','🎒 Инвентарь'],['up','⚡ Апгрейдер'],['con','📑 Контракт']];
function render(){stopF();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}${t[0]=='inv'?' ('+st.inv.length+')':''}</button>`).join('');({cases:rCases,flappy:rFlappy,inv:rInv,up:rUp,con:rCon})[tab]();hdr()}
function rCases(){$('#v').innerHTML=`<h2>Кейсы</h2><div class="cases">${C.map((c,i)=>({...c,i})).sort((a,b)=>a.p-b.p).map(c=>`<div class="case" style="--c:${c.c}"><div class="box" data-symbol="${c.emoji||'★'}"></div><h3 style="margin:6px 0">${c.n}</h3>${c.desc?'<div class="mut">'+c.desc+'</div>':''}<div class="mut">Шансы: ${['⚪','🔵','🟣','🩷','🔴','🟡'].map((e,j)=>c.w[j]?e+c.w[j]+'%':'').join(' ')}</div><br><button class="btn" onclick="openCase(${c.i})">Открыть за $${c.p}</button></div>`).join('')}</div><p class="mut">Нет денег? Играй во Flappy: каждая труба = $3.</p>`}
function openCase(ci){const c=C[ci];if(st.bal<c.p)return toast('Не хватает денег — сыграй во Flappy!');st.bal-=c.p;hdr();const win=roll(ci),WI=38;let h='';for(let i=0;i<45;i++)h+=card(i==WI?win:roll(ci));
ov.innerHTML=`<div class="ovb"><h2>${c.n}</h2><div class="rl"><div class="ptr"></div><div class="strip" id="strip">${h}</div></div><div id="res" style="min-height:230px"></div></div>`;ov.classList.add('on');
const s=$('#strip'),cw=s.parentElement.clientWidth;s.getBoundingClientRect();s.style.transition='transform 6.5s cubic-bezier(.12,.8,.12,1)';s.style.transform=`translateX(${-(WI*140+70-cw/2+(Math.random()-.5)*90)}px)`;
setTimeout(()=>{st.inv.push(win);hdr();$('#res').innerHTML=`${card(win,'big')}<div class="row"><button class="btn" onclick="closeOv()">Забрать</button><button class="btn g" onclick="sell(${win.id});closeOv()">Продать за $${pr(win)}</button><button class="btn r" onclick="closeOv();openCase(${ci})">Ещё раз ($${c.p})</button></div>`},6800)}
function sell(id){const i=st.inv.findIndex(x=>x.id==id);if(i<0)return;const it=st.inv.splice(i,1)[0];money(pr(it))}
function rInv(){const l=[...st.inv].sort((a,b)=>pr(b)-pr(a)),tot=l.reduce((a,b)=>a+pr(b),0);$('#v').innerHTML=`<h2>Инвентарь <span class="mut">· стоимость $${tot}</span></h2><div class="row" style="justify-content:flex-start;margin:0 0 14px"><button class="btn g" onclick="sellLow(1)">Продать серые и синие</button><button class="btn r" onclick="sellLow(5)">Продать всё</button></div>${l.length?`<div class="grid">${l.map(it=>card(it,'','onclick="sell('+it.id+');render()" title="Клик — продать"')).join('')}</div><p class="mut">Клик по скину — продать.</p>`:'<p class="mut">Пусто. Открой кейс!</p>'}`}
function sellLow(r){const l=st.inv.filter(x=>S[x.s].r<=r);if(!l.length)return;if(r==5&&!confirm('Продать ВСЁ?'))return;st.inv=st.inv.filter(x=>S[x.s].r>r);money(l.reduce((a,b)=>a+pr(b),0));render()}
const grid=(l,sel,fn)=>l.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${[...l].sort((a,b)=>pr(b)-pr(a)).map(it=>card(it,sel(it.id)?'sel':'',`onclick="${fn}(${it.id})"`)).join('')}</div>`:'<p class="mut">В инвентаре пусто.</p>';
let up={sel:null,m:2},busy=0;
function rUp(){const it=st.inv.find(x=>x.id==up.sel),ch=Math.min(90,95/up.m),tp=it?pr(it)*up.m:0;$('#v').innerHTML=`<h2>Апгрейдер</h2><div class="two"><div class="panel" style="text-align:center">${it?card(it):'<p class="mut">Выбери скин справа</p>'}<div class="m">${[2,3,5,10].map(x=>`<button class="btn ${x==up.m?'':'g'}" onclick="up.m=${x};rUp()">x${x}</button>`).join('')}</div>
<div class="wheel" style="background:conic-gradient(#6dff9c 0 ${ch}%,#2a2f45 0)"><i id="arr"></i><b>${ch.toFixed(1)}%</b></div><div class="mut">Цель: ~$${tp}</div><br><button class="btn" id="ub" onclick="doUp()">Апгрейд</button></div>
<div class="panel">${grid(st.inv,i=>i==up.sel,'selUp')}</div></div>`}
function selUp(id){if(busy)return;up.sel=id;rUp()}
function doUp(){const it=st.inv.find(x=>x.id==up.sel);if(!it||busy)return toast('Выбери скин');busy=1;const ch=Math.min(90,95/up.m),win=Math.random()*100<ch,tp=pr(it)*up.m,a=win?ch*3.6*(.1+Math.random()*.8):ch*3.6+(360-ch*3.6)*(.05+Math.random()*.9);
st.inv=st.inv.filter(x=>x!=it);hdr();$('#arr').style.transform=`rotate(${1800+a}deg)`;
setTimeout(()=>{busy=0;up.sel=null;if(win){let l=P.filter(x=>Math.abs(x.p-tp)<=tp*.15);if(!l.length)l=[P.reduce((a,b)=>Math.abs(a.p-tp)<Math.abs(b.p-tp)?a:b)];const p=l[Math.random()*l.length|0],n={id:++st.id,s:p.s,w:p.w};st.inv.push(n);showRes('🎉 Успех!',n,'Апгрейд x'+up.m+' прошёл')}else showRes('Не повезло',null,'Скин сгорел')},5400)}
let con=[];
function rCon(){con=con.filter(id=>st.inv.some(x=>x.id==id));const sl=con.map(id=>st.inv.find(x=>x.id==id));$('#v').innerHTML=`<h2>Контракт обмена</h2><div class="two"><div class="panel"><div class="mut">Выбери 10 скинов — получишь скин на ступень выше средней редкости.</div><div class="slots">${Array.from({length:10},(_,i)=>`<div class="slot" style="${sl[i]?'border-color:'+R[S[sl[i].s].r]+';color:'+R[S[sl[i].s].r]:''}">${sl[i]?'$'+pr(sl[i]):i+1}</div>`).join('')}</div><div class="mut">Сумма: $${sl.reduce((a,b)=>a+pr(b),0)}</div><br><button class="btn" onclick="doCon()" ${sl.length==10?'':'disabled'}>Подписать контракт (${sl.length}/10)</button></div><div class="panel">${grid(st.inv.filter(x=>S[x.s].r<5),i=>con.includes(i),'togCon')}</div></div>`}
function togCon(id){const i=con.indexOf(id);if(i>=0)con.splice(i,1);else if(con.length<10)con.push(id);rCon()}
function doCon(){const l=con.map(id=>st.inv.find(x=>x.id==id)),r=Math.min(5,Math.round(l.reduce((a,b)=>a+S[b.s].r,0)/10)+1);st.inv=st.inv.filter(x=>!con.includes(x.id));con=[];const n=mk(r);st.inv.push(n);hdr();showRes('📑 Контракт выполнен',n,'Редкость: '+RN[r])}
let fid=0,fkey;const stopF=()=>{cancelAnimationFrame(fid);fid=0};
function rFlappy(){$('#v').innerHTML=`<h2>Flappy Bird — заработок</h2><canvas id="cv" width="420" height="600"></canvas><p class="mut" style="text-align:center">Пробел / клик / тап — взмах. Каждая труба = +$3</p>`;
const cv=$('#cv'),g=cv.getContext('2d');let y,vy,pipes,sc,go,started,fr,last,best=+localStorage.getItem('fb')||0;
const reset=()=>{y=280;vy=0;pipes=[];sc=0;go=0;started=0;fr=0};reset();
const flap=()=>{if(go){if(performance.now()-go>500)reset();return}started=1;vy=-7.2};
cv.onpointerdown=flap;fkey=e=>{if(e.code=='Space'&&tab=='flappy'){e.preventDefault();flap()}};document.onkeydown=fkey;
function loop(t){fid=requestAnimationFrame(loop);const d=Math.min(2.5,(t-(last||t))/16.67);last=t;
if(started&&!go){fr+=d;vy+=.42*d;y+=vy*d;if(fr>=90||!pipes.length){fr=0;pipes.push({x:430,gy:140+Math.random()*290,ok:0})}
pipes.forEach(p=>{p.x-=2.7*d;if(!p.ok&&p.x+52<80){p.ok=1;sc++;money(3);const e=document.createElement('div');e.className='fp';e.textContent='+$3';const b=cv.getBoundingClientRect();e.style.left=b.left+b.width/2+'px';e.style.top=b.top+y+'px';document.body.appendChild(e);setTimeout(()=>e.remove(),1000)}
if(80+14>p.x&&80-14<p.x+52&&(y-14<p.gy-80||y+14>p.gy+80))go=go||performance.now()});pipes=pipes.filter(p=>p.x>-60);if(y>586||y<14)go=go||performance.now();if(go&&sc>best){best=sc;try{localStorage.setItem('fb',best)}catch(e){}}}
const gr=g.createLinearGradient(0,0,0,600);gr.addColorStop(0,'#4ec0ff');gr.addColorStop(1,'#bfeaff');g.fillStyle=gr;g.fillRect(0,0,420,600);
g.fillStyle='#fff8';[[60,90],[250,150],[360,60]].forEach(([x,yy],i)=>{const o=(t/(40+i*20))%520;g.beginPath();g.arc((x-o+520)%520-50,yy,26,0,7);g.arc((x-o+520)%520-20,yy+6,22,0,7);g.arc((x-o+520)%520-76,yy+6,20,0,7);g.fill()});
pipes.forEach(p=>{const pg=g.createLinearGradient(p.x,0,p.x+52,0);pg.addColorStop(0,'#2e9e2e');pg.addColorStop(.5,'#7be05a');pg.addColorStop(1,'#2e9e2e');g.fillStyle=pg;g.fillRect(p.x,0,52,p.gy-80);g.fillRect(p.x,p.gy+80,52,600);g.fillRect(p.x-4,p.gy-100,60,20);g.fillRect(p.x-4,p.gy+80,60,20)});
g.save();g.translate(80,y);g.rotate(Math.max(-.5,Math.min(1.2,vy/12)));g.fillStyle='#ffd23f';g.beginPath();g.arc(0,0,15,0,7);g.fill();g.fillStyle='#fff';g.beginPath();g.arc(7,-5,5,0,7);g.fill();g.fillStyle='#000';g.beginPath();g.arc(9,-5,2,0,7);g.fill();g.fillStyle='#ff6a3d';g.fillRect(10,2,10,5);g.fillStyle='#f0a500';g.beginPath();g.ellipse(-5,3+Math.sin(t/80)*3,8,5,0,0,7);g.fill();g.restore();
g.fillStyle='#fff';g.strokeStyle='#000';g.lineWidth=4;g.font='900 44px sans-serif';g.textAlign='center';g.strokeText(sc,210,70);g.fillText(sc,210,70);g.font='700 14px sans-serif';g.fillStyle='#000a';g.fillText('Рекорд: '+best+' · заработано: $'+sc*3,210,95);
if(!started||go){g.fillStyle='#000a';g.fillRect(60,230,300,110);g.fillStyle='#fff';g.font='800 24px sans-serif';g.fillText(go?'Конец! +$'+sc*3:'Готов?',210,275);g.font='15px sans-serif';g.fillText('Пробел или клик — '+(go?'заново':'старт'),210,310)}}
fid=requestAnimationFrame(loop)}
render();
</script></body></html>
