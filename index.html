<!DOCTYPE html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>CASE DROP</title>
<style>
:root{--bg:#0b0d15;--p:#161a29;--p2:#20253a;--t:#e8ebf5;--m:#8a91ad;--ac:#ffb020;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#1b2040,var(--bg));color:var(--t);font-family:Inter,system-ui,Segoe UI,sans-serif;min-height:100%}
header{display:flex;align-items:center;gap:16px;padding:12px 20px;background:#0a0c14cc;border-bottom:1px solid #ffffff14;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;flex-wrap:wrap}
.logo{font-weight:900;letter-spacing:2px;font-size:20px;background:linear-gradient(90deg,#ffb020,#ff4d6d);-webkit-background-clip:text;color:transparent}
nav{display:flex;gap:6px;flex:1;flex-wrap:wrap}nav button{background:var(--p);border:1px solid #ffffff12;color:var(--t);padding:9px 14px;border-radius:10px;cursor:pointer;font-size:14px;transition:.2s}
nav button:hover{background:var(--p2);transform:translateY(-2px)}nav button.on{background:linear-gradient(135deg,#ffb020,#ff6a3d);color:#1a1000;font-weight:700}
.bal{font-size:20px;font-weight:800;color:#6dff9c;background:var(--p);padding:8px 16px;border-radius:12px;border:1px solid #6dff9c33}.bal.pop{animation:pop .4s}
@keyframes pop{50%{transform:scale(1.25);box-shadow:0 0 24px #6dff9c88}}
main{max-width:1150px;margin:0 auto;padding:20px}h2{margin:0 0 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px}
.cases{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}
.case{background:linear-gradient(160deg,var(--p2),var(--p));border:1px solid #ffffff14;border-radius:18px;padding:20px;text-align:center;position:relative;overflow:hidden;transition:.25s}
.case:hover{transform:translateY(-6px);border-color:var(--c);box-shadow:0 10px 40px -10px var(--c)}
.box{width:130px;height:110px;margin:6px auto 10px;border-radius:14px;background:linear-gradient(145deg,var(--c),#0006);position:relative;animation:fl 3s ease-in-out infinite;box-shadow:0 0 40px -6px var(--c)}
.box:before{content:"";position:absolute;inset:0 0 auto 0;height:34%;background:#0004;border-radius:14px 14px 0 0}.box:after{content:"★";position:absolute;inset:0;display:grid;place-items:center;font-size:44px;color:#fff9;text-shadow:0 0 14px #fff}
@keyframes fl{50%{transform:translateY(-8px) rotate(2deg)}}
.btn{background:linear-gradient(135deg,#ffb020,#ff6a3d);color:#1a1000;border:0;font-weight:800;padding:10px 18px;border-radius:10px;cursor:pointer;font-size:15px;transition:.15s}.btn:hover{filter:brightness(1.15);transform:scale(1.04)}
.btn.g{background:var(--p2);color:var(--t);border:1px solid #ffffff20}.btn.r{background:linear-gradient(135deg,#ff4d6d,#c2185b);color:#fff}.btn:disabled{opacity:.4;pointer-events:none}
.card{--c:#999;background:linear-gradient(180deg,#ffffff0a,#0003),var(--p);border:1px solid #ffffff10;border-bottom:3px solid var(--c);border-radius:12px;padding:8px;text-align:center;position:relative;overflow:hidden;cursor:pointer;transition:.2s;user-select:none}
.card:hover{transform:translateY(-4px);box-shadow:0 8px 24px -8px var(--c)}.card:after{content:"";position:absolute;top:0;left:-80%;width:50%;height:100%;background:linear-gradient(100deg,transparent,#fff3,transparent);transform:skewX(-20deg)}.card:hover:after{left:130%;transition:.7s}
.card.sel{outline:2px solid #6dff9c;box-shadow:0 0 22px #6dff9c66}.card svg{width:100%;height:64px;filter:drop-shadow(0 4px 8px #000a)}
.n{font-size:12px;font-weight:700;margin-top:2px}.w{font-size:10px;color:var(--m)}.pr{color:#6dff9c;font-weight:800;font-size:13px;margin-top:2px}
#ov{position:fixed;inset:0;background:#05060bf0;display:none;z-index:20;align-items:center;justify-content:center;padding:16px}#ov.on{display:flex;animation:fi .3s}@keyframes fi{from{opacity:0}}
.ovb{width:min(980px,100%);text-align:center}.rl{position:relative;overflow:hidden;background:#0008;border-radius:14px;border:1px solid #ffffff1a;padding:12px 0;margin:12px 0}
.rl:before,.rl:after{content:"";position:absolute;top:0;bottom:0;width:120px;z-index:2;pointer-events:none}.rl:before{left:0;background:linear-gradient(90deg,#05060b,transparent)}.rl:after{right:0;background:linear-gradient(-90deg,#05060b,transparent)}
.ptr{position:absolute;left:50%;top:0;bottom:0;width:3px;background:#ffb020;box-shadow:0 0 14px #ffb020;z-index:3}
.strip{display:flex;will-change:transform}.strip .card{flex:0 0 130px;margin:0 5px;cursor:default}
.big{display:inline-block;width:260px;animation:rv .7s cubic-bezier(.2,1.6,.4,1)}.big.card{cursor:default;box-shadow:0 0 80px -5px var(--c);border:2px solid var(--c)}.big svg{height:110px}.big .n{font-size:16px}.big .pr{font-size:20px}
@keyframes rv{from{transform:scale(.2) rotate(-12deg);opacity:0}}
.row{display:flex;gap:10px;justify-content:center;margin-top:14px;flex-wrap:wrap}
.panel{background:var(--p);border:1px solid #ffffff12;border-radius:16px;padding:16px}.two{display:grid;grid-template-columns:320px 1fr;gap:16px}@media(max-width:800px){.two{grid-template-columns:1fr}}
.wheel{width:230px;height:230px;border-radius:50%;margin:10px auto;position:relative;border:6px solid var(--p2);box-shadow:0 0 40px #0008}
.wheel i{position:absolute;inset:0;transition:transform 5s cubic-bezier(.1,.7,.1,1);transform-origin:50% 50%}.wheel i:after{content:"";position:absolute;left:50%;top:-6px;margin-left:-6px;border:8px solid transparent;border-top:0;border-bottom:26px solid #fff;filter:drop-shadow(0 0 6px #fff)}
.wheel b{position:absolute;inset:0;display:grid;place-items:center;font-size:30px}
.m{display:flex;gap:6px;justify-content:center;margin:8px 0}.m button{flex:1}
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin:10px 0}.slot{aspect-ratio:1.4;border:1px dashed #ffffff30;border-radius:8px;display:grid;place-items:center;color:var(--m);font-size:12px}
#toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:#ff4d6d;padding:12px 20px;border-radius:12px;font-weight:700;z-index:30;transition:.3s}#toast.on{transform:translate(-50%,0)}
canvas{display:block;margin:0 auto;border-radius:16px;border:2px solid #ffffff22;max-width:100%;cursor:pointer;box-shadow:0 0 50px #3b82f622}
.fp{position:fixed;color:#6dff9c;font-weight:900;font-size:22px;pointer-events:none;z-index:25;animation:up 1s forwards}@keyframes up{to{transform:translateY(-70px);opacity:0}}
.mut{color:var(--m);font-size:13px}
</style></head><body>
<header><div class="logo">CASE DROP</div><nav id="nav"></nav><div class="bal" id="bal"></div></header>
<main id="v"></main><div id="ov"></div><div id="toast"></div>
<script>
const $=s=>document.querySelector(s),R=['#b0c3d9','#5e98d9','#8847ff','#d32ce6','#eb4b4b','#e4ae39'],RN=['Ширпотреб','Промышленное','Армейское','Запрещённое','Засекреченное','Редкий нож'];
const WEAR=[['Прямо с завода',1.6],['Немного поношенное',1.2],['После полевых',1],['Поношенное',.8],['Закалённое в боях',.6]];
const S=`p|P250|Песчаная дюна|0|#c9b37a|#7a6a3a|6;p|Glock-18|Ржавчина|0|#b5651d|#4a2a10|7;r|Galil|Болото|0|#6b8e4e|#2f4a2a|8;s|SSG 08|Туман|0|#9aa8b5|#4b5563|9;r|M4A4|Неоновый шторм|1|#00d4ff|#0a3a8a|28;p|Desert Eagle|Кобальт|1|#3b82f6|#1e1b4b|30;r|AK-47|Красная линия|1|#ef4444|#1a1a1a|35;s|AWP|Лесной дух|1|#22c55e|#14532d|40;r|FAMAS|Закат|1|#fb923c|#7c2d12|25;r|AK-47|Огненный змей|2|#f97316|#7f1d1d|110;r|M4A1-S|Хромовый сон|2|#a78bfa|#312e81|95;p|USP-S|Токсин|2|#84cc16|#1a2e05|90;s|AWP|Бездна|2|#06b6d4|#083344|140;p|Glock-18|Фиолетовый вихрь|2|#c026d3|#3b0764|85;r|AK-47|Королевская кровь|3|#f43f5e|#4c0519|380;r|M4A4|Неоновый император|3|#e879f9|#4a044e|330;s|AWP|Горный лев|3|#fbbf24|#78350f|450;p|Desert Eagle|Пламя дракона|3|#ff6a00|#400|300;r|AK-47|Золотая лихорадка|4|#facc15|#713f12|1400;s|AWP|Ледяная молния|4|#67e8f9|#1e3a8a|1700;r|M4A1-S|Кибер-ронин|4|#22d3ee|#be123c|1200;p|Desert Eagle|Солнечный удар|4|#fde047|#b91c1c|1000;k|Нож-бабочка|Гамма-волна|5|#34d399|#064e3b|4500;k|Керамбит|Багровый закат|5|#f43f5e|#1e1b4b|5500;k|Штык-нож|Звёздная ночь|5|#818cf8|#0f172a|4000;k|Складной нож|Золото|5|#fbbf24|#451a03|6500`.split(';').map(x=>{const a=x.split('|');return{t:a[0],w:a[1],n:a[2],r:+a[3],c1:a[4],c2:a[5],p:+a[6]}});
const C=[{n:'Уличный кейс',p:30,w:[78,18,3.5,.5,0,0],c:'#5e98d9'},{n:'Городской кейс',p:100,w:[45,32,16,6,1,0],c:'#8847ff'},{n:'Элитный кейс',p:300,w:[20,30,30,15,4.5,.5],c:'#d32ce6'},{n:'Легендарный кейс',p:800,w:[0,15,35,35,12,3],c:'#e4ae39'}];
let st={bal:100,inv:[],id:0};try{const x=JSON.parse(localStorage.getItem('cd1'));if(x)st=x}catch(e){}
const save=()=>{try{localStorage.setItem('cd1',JSON.stringify(st))}catch(e){}};
const pr=it=>Math.round(S[it.s].p*WEAR[it.w][1]),P=[];S.forEach((k,s)=>WEAR.forEach((w,i)=>P.push({s,w:i,p:Math.round(k.p*w[1])})));
let uid=0;const PATH={r:'M4 34H62L74 24H150V19H190V28H152V32H122L108 58H94L99 40H72L62 58H46L50 40H4Z',p:'M34 22H146V38H104L98 44L88 66H66L76 40H34Z',s:'M2 30H90L100 22H146V18H196V26H148V32H118L106 56H92L96 38H66L56 58H40L44 38H2Z',k:'M8 46L118 14Q146 18 150 34L128 38L24 50ZM128 34L192 42V52L124 44Z'};
function gun(s){const k=S[s],u=++uid,d=PATH[k.t],m=s%3,pat=m==0?'<rect width="4" height="12" fill="#fff" opacity=".3"/>':m==1?'<circle cx="6" cy="6" r="2.5" fill="#fff" opacity=".35"/>':'<path d="M0 0L12 12" stroke="#000" stroke-width="3" opacity=".35"/>';
return`<svg viewBox="0 0 200 70"><defs><linearGradient id="g${u}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${k.c1}"/><stop offset="1" stop-color="${k.c2}"/></linearGradient><pattern id="p${u}" width="12" height="12" patternUnits="userSpaceOnUse" patternTransform="rotate(${s*17})">${pat}</pattern></defs><path d="${d}" fill="url(#g${u})" stroke="#000b" stroke-width="2"/><path d="${d}" fill="url(#p${u})"/></svg>`}
const card=(it,cl='',oc='')=>{const k=S[it.s];return`<div class="card ${cl}" style="--c:${R[k.r]}" ${oc}>${gun(it.s)}<div class="n">${k.w} | ${k.n}</div><div class="w">${WEAR[it.w][0]}</div><div class="pr">$${pr(it)}</div></div>`};
function roll(ci){const w=C[ci].w;let x=Math.random()*w.reduce((a,b)=>a+b),r=0;for(;r<5&&x>=w[r];r++)x-=w[r];return mk(r)}
function mk(r){const l=S.map((k,i)=>i).filter(i=>S[i].r==r),w=[2,4,5,3,2],t=Math.random()*16;let a=0,i=0;for(;i<4&&(a+=w[i])<=t;i++);return{id:++st.id,s:l[Math.random()*l.length|0],w:i}}
function toast(t){const e=$('#toast');e.textContent=t;e.classList.add('on');setTimeout(()=>e.classList.remove('on'),2200)}
function hdr(pop){const b=$('#bal');b.textContent='$'+st.bal.toLocaleString('ru');if(pop){b.classList.remove('pop');void b.offsetWidth;b.classList.add('pop')}save()}
function money(n){st.bal+=n;hdr(1)}
const ov=$('#ov'),closeOv=()=>{ov.classList.remove('on');render()};
function showRes(title,it,sub){ov.innerHTML=`<div class="ovb"><h2>${title}</h2>${it?card(it,'big'):'<div style="font-size:70px">💥</div>'}<p class="mut">${sub||''}</p><div class="row"><button class="btn" onclick="closeOv()">Ок</button></div></div>`;ov.classList.add('on')}
let tab='cases';const TABS=[['cases','📦 Кейсы'],['flappy','🐦 Заработок'],['inv','🎒 Инвентарь'],['up','⚡ Апгрейдер'],['con','📑 Контракт']];
function render(){stopF();$('#nav').innerHTML=TABS.map(t=>`<button class="${t[0]==tab?'on':''}" onclick="tab='${t[0]}';render()">${t[1]}${t[0]=='inv'?' ('+st.inv.length+')':''}</button>`).join('');({cases:rCases,flappy:rFlappy,inv:rInv,up:rUp,con:rCon})[tab]();hdr()}
function rCases(){$('#v').innerHTML=`<h2>Кейсы</h2><div class="cases">${C.map((c,i)=>`<div class="case" style="--c:${c.c}"><div class="box"></div><h3 style="margin:6px 0">${c.n}</h3><div class="mut">Шансы: ${['⚪','🔵','🟣','🩷','🔴','🟡'].map((e,j)=>c.w[j]?e+c.w[j]+'%':'').join(' ')}</div><br><button class="btn" onclick="openCase(${i})">Открыть за $${c.p}</button></div>`).join('')}</div><p class="mut">Нет денег? Играй во Flappy: каждая труба = $3.</p>`}
function openCase(ci){const c=C[ci];if(st.bal<c.p)return toast('Не хватает денег — сыграй во Flappy!');st.bal-=c.p;hdr();const win=roll(ci),WI=38;let h='';for(let i=0;i<45;i++)h+=card(i==WI?win:roll(ci));
ov.innerHTML=`<div class="ovb"><h2>${c.n}</h2><div class="rl"><div class="ptr"></div><div class="strip" id="strip">${h}</div></div><div id="res" style="min-height:230px"></div></div>`;ov.classList.add('on');
const s=$('#strip'),cw=s.parentElement.clientWidth;s.getBoundingClientRect();s.style.transition='transform 6.5s cubic-bezier(.12,.8,.12,1)';s.style.transform=`translateX(${-(WI*140+70-cw/2+(Math.random()-.5)*90)}px)`;
setTimeout(()=>{st.inv.push(win);hdr();$('#res').innerHTML=`${card(win,'big')}<div class="row"><button class="btn" onclick="closeOv()">Забрать</button><button class="btn g" onclick="sell(${win.id});closeOv()">Продать за $${pr(win)}</button><button class="btn r" onclick="closeOv();openCase(${ci})">Ещё раз ($${c.p})</button></div>`},6800)}
function sell(id){const i=st.inv.findIndex(x=>x.id==id);if(i<0)return;const it=st.inv.splice(i,1)[0];money(pr(it))}
function rInv(){const l=[...st.inv].sort((a,b)=>pr(b)-pr(a)),tot=l.reduce((a,b)=>a+pr(b),0);$('#v').innerHTML=`<h2>Инвентарь <span class="mut">· стоимость $${tot}</span></h2><div class="row" style="justify-content:flex-start;margin:0 0 14px"><button class="btn g" onclick="sellLow(1)">Продать серые и синие</button><button class="btn r" onclick="sellLow(5)">Продать всё</button></div>${l.length?`<div class="grid">${l.map(it=>card(it,'','onclick="sell('+it.id+');render()" title="Клик — продать"')).join('')}</div><p class="mut">Клик по скину — продать.</p>`:'<p class="mut">Пусто. Открой кейс!</p>'}`}
function sellLow(r){const l=st.inv.filter(x=>S[x.s].r<=r);if(!l.length)return;if(r==5&&!confirm('Продать ВСЁ?'))return;st.inv=st.inv.filter(x=>S[x.s].r>r);money(l.reduce((a,b)=>a+pr(b),0));render()}
const grid=(l,sel,fn)=>l.length?`<div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(130px,1fr))">${[...l].sort((a,b)=>pr(b)-pr(a)).map(it=>card(it,sel(it.id)?'sel':'',`onclick="${fn}(${it.id})"`)).join('')}</div>`:'<p class="mut">В инвентаре пусто.</p>';
let up={sel:null,m:2},busy=0;
function rUp(){const it=st.inv.find(x=>x.id==up.sel),ch=Math.min(90,95/up.m),tp=it?pr(it)*up.m:0;$('#v').innerHTML=`<h2>Апгрейдер</h2><div class="two"><div class="panel" style="text-align:center">${it?card(it):'<p class="mut">Выбери скин справа</p>'}<div class="m">${[2,3,5,10].map(x=>`<button class="btn ${x==up.m?'':'g'}" onclick="up.m=${x};rUp()">x${x}</button>`).join('')}</div>
<div class="wheel" style="background:conic-gradient(#6dff9c 0 ${ch}%,#2a2f45 0)"><i id="arr"></i><b>${ch.toFixed(1)}%</b></div><div class="mut">Цель: ~$${tp}</div><br><button class="btn" id="ub" onclick="doUp()">Апгрейд</button></div>
<div class="panel">${grid(st.inv,i=>i==up.sel,'selUp')}</div></div>`}
function selUp(id){if(busy)return;up.sel=id;rUp()}
function doUp(){const it=st.inv.find(x=>x.id==up.sel);if(!it||busy)return toast('Выбери скин');busy=1;const ch=Math.min(90,95/up.m),win=Math.random()*100<ch,tp=pr(it)*up.m,a=win?ch*3.6*(.1+Math.random()*.8):ch*3.6+(360-ch*3.6)*(.05+Math.random()*.9);
st.inv=st.inv.filter(x=>x!=it);hdr();$('#arr').style.transform=`rotate(${1800+a}deg)`;
setTimeout(()=>{busy=0;up.sel=null;if(win){let l=P.filter(x=>Math.abs(x.p-tp)<=tp*.15);if(!l.length)l=[P.reduce((a,b)=>Math.abs(a.p-tp)<Math.abs(b.p-tp)?a:b)];const p=l[Math.random()*l.length|0],n={id:++st.id,s:p.s,w:p.w};st.inv.push(n);showRes('🎉 Успех!',n,'Апгрейд x'+up.m+' прошёл')}else showRes('Не повезло',null,'Скин сгорел')},5400)}
let con=[];
function rCon(){con=con.filter(id=>st.inv.some(x=>x.id==id));const sl=con.map(id=>st.inv.find(x=>x.id==id));$('#v').innerHTML=`<h2>Контракт обмена</h2><div class="two"><div class="panel"><div class="mut">Выбери 10 скинов — получишь скин на ступень выше средней редкости.</div><div class="slots">${Array.from({length:10},(_,i)=>`<div class="slot" style="${sl[i]?'border-color:'+R[S[sl[i].s].r]+';color:'+R[S[sl[i].s].r]:''}">${sl[i]?'$'+pr(sl[i]):i+1}</div>`).join('')}</div><div class="mut">Сумма: $${sl.reduce((a,b)=>a+pr(b),0)}</div><br><button class="btn" onclick="doCon()" ${sl.length==10?'':'disabled'}>Подписать контракт (${sl.length}/10)</button></div><div class="panel">${grid(st.inv.filter(x=>S[x.s].r<5),i=>con.includes(i),'togCon')}</div></div>`}
function togCon(id){const i=con.indexOf(id);if(i>=0)con.splice(i,1);else if(con.length<10)con.push(id);rCon()}
function doCon(){const l=con.map(id=>st.inv.find(x=>x.id==id)),r=Math.min(5,Math.round(l.reduce((a,b)=>a+S[b.s].r,0)/10)+1);st.inv=st.inv.filter(x=>!con.includes(x.id));con=[];const n=mk(r);st.inv.push(n);hdr();showRes('📑 Контракт выполнен',n,'Редкость: '+RN[r])}
let fid=0,fkey;const stopF=()=>{cancelAnimationFrame(fid);fid=0};
function rFlappy(){$('#v').innerHTML=`<h2>Flappy Bird — заработок</h2><canvas id="cv" width="420" height="600"></canvas><p class="mut" style="text-align:center">Пробел / клик / тап — взмах. Каждая труба = +$3</p>`;
const cv=$('#cv'),g=cv.getContext('2d');let y,vy,pipes,sc,go,started,fr,last,best=+localStorage.getItem('fb')||0;
const reset=()=>{y=280;vy=0;pipes=[];sc=0;go=0;started=0;fr=0};reset();
const flap=()=>{if(go){if(performance.now()-go>500)reset();return}started=1;vy=-7.2};
cv.onpointerdown=flap;fkey=e=>{if(e.code=='Space'&&tab=='flappy'){e.preventDefault();flap()}};document.onkeydown=fkey;
